version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: anime-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: jellyfin_anime_dev
      POSTGRES_USER: dev_user
      POSTGRES_PASSWORD: dev_password
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - anime-network-dev

  # Redis (for caching - optional)
  redis:
    image: redis:7-alpine
    container_name: anime-redis-dev
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - anime-network-dev
    command: redis-server --appendonly yes
    volumes:
      - redis_dev_data:/data

volumes:
  postgres_dev_data:
    driver: local
  redis_dev_data:
    driver: local

networks:
  anime-network-dev:
    driver: bridge
